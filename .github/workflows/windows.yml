name: Windows verification and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare isolated temporary storage and pinned dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $taskTemp = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) ('QiyaoPipeline-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $taskTemp > $null
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($taskTemp)).AvailableFreeSpace -lt 2GB) { throw 'Insufficient verification storage.' }
          "TEMP=$taskTemp" >> $env:GITHUB_ENV
          "TMP=$taskTemp" >> $env:GITHUB_ENV
          npm install --global pnpm@10.32.1
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Verify types, unit coverage and complete redistribution notices
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm check
          pnpm test:coverage --maxWorkers=1
          pnpm notices:release
      - name: Build the audited Windows installer and portable executable
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm prepare:installer
          pnpm build
          node scripts/package-windows.mjs
          pnpm test:package --installer
      - name: Verify the complete packaged desktop and settings
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:QIYAO_TEST_EXECUTABLE = (Resolve-Path artifacts/win-unpacked/Qiyao.exe).Path
          pnpm test:desktop
          $env:QIYAO_TEST_SURFACES_ONLY = '1'
          try { pnpm test:desktop } finally { Remove-Item Env:QIYAO_TEST_SURFACES_ONLY }
      - name: Verify actual bootstrap plugins and portable execution
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $taskArchiveCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $taskArchiveTool = if ($taskArchiveCommand) { $taskArchiveCommand.Source } else { Join-Path $env:ProgramFiles '7-Zip/7z.exe' }
          if (-not (Test-Path -LiteralPath $taskArchiveTool)) { throw 'The Windows runner requires the complete 7-Zip executable with NSIS support.' }
          $env:QIYAO_ARCHIVE_TOOL = $taskArchiveTool
          pnpm test:distribution
          pnpm test:portable
      - name: Verify current-user installation, installed desktop and data-preserving uninstall
        run: ./scripts/verify-installer.ps1
      - name: Prepare exact tagged source, bilingual notes and checksums
        if: startsWith(github.ref, 'refs/tags/')
        env:
          QIYAO_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release.mjs $env:QIYAO_RELEASE_TAG
      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/*-result.json
            verification/screenshots/*.png
            coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload the complete verified release bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qiyao-release-${{ github.sha }}
          path: artifacts/release/*
          retention-days: 7
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qiyao-release-${{ github.sha }}
          path: release
      - name: Verify all downloads and publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QIYAO_RELEASE_TAG: ${{ github.ref_name }}
          QIYAO_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $taskManifest = Get-Content release/verification.json -Raw | ConvertFrom-Json
          if ($taskManifest.tag -ne $env:QIYAO_RELEASE_TAG -or $taskManifest.commit -ne $env:QIYAO_RELEASE_COMMIT) { throw 'Release download does not match this tag and commit.' }
          $taskFiles = @()
          foreach ($taskLine in Get-Content release/SHA256SUMS.txt) {
            if ($taskLine -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid release checksum entry.' }
            $taskHash = $Matches[1]
            $taskFile = Join-Path 'release' $Matches[2]
            if ((Get-FileHash -LiteralPath $taskFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $taskHash) { throw 'Downloaded release checksum does not match.' }
            $taskFiles += $taskFile
          }
          if ($taskFiles.Count -ne 5 -or @($taskFiles | Select-Object -Unique).Count -ne 5) { throw 'Release bundle must contain exactly five distinct verified files.' }
          $taskFiles += 'release/SHA256SUMS.txt'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskExistingText = gh release view $env:QIYAO_RELEASE_TAG --json isDraft,tagName,targetCommitish 2>$null
          $taskExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($taskExists) {
            $taskExisting = $taskExistingText | ConvertFrom-Json
            if (-not $taskExisting.isDraft -or $taskExisting.tagName -ne $env:QIYAO_RELEASE_TAG -or $taskExisting.targetCommitish -ne $env:QIYAO_RELEASE_COMMIT) { throw 'A published or unrelated release must be preserved.' }
            gh release edit $env:QIYAO_RELEASE_TAG --notes-file release/release-notes.md
          } else {
            $taskCreate = @('release', 'create', $env:QIYAO_RELEASE_TAG, '--verify-tag', '--target', $env:QIYAO_RELEASE_COMMIT, '--title', "Qiyao $($taskManifest.version)", '--notes-file', 'release/release-notes.md', '--draft')
            if ($taskManifest.prerelease) { $taskCreate += '--prerelease' }
            gh @taskCreate
          }
          gh release upload $env:QIYAO_RELEASE_TAG @taskFiles --clobber
          gh release edit $env:QIYAO_RELEASE_TAG --draft=false
          gh release view $env:QIYAO_RELEASE_TAG --json url,isDraft,tagName,assets
