name: Desktop prerelease builds

on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag
        required: true
        default: v0.1.0-alpha.1

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-14
            platform: mac
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install pinned dependencies on the native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'require("node:assert/strict").equal(process.arch, process.env.EXPECTED_ARCH)'
          npm install --global pnpm@10.32.1
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Check types, tests, legal inventory and build
        run: |
          pnpm check
          pnpm test --maxWorkers=1
          pnpm notices
          pnpm notices:release
          pnpm build
      - name: Package macOS
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac dmg zip --${{ matrix.arch }} --publish never -c.npmRebuild=true -c.mac.icon=identity/qiyao.png
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never -c.npmRebuild=true -c.linux.icon=identity/qiyao.png -c.linux.category=Development
      - name: Upload only completed native build assets to the existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/upload-desktop-prerelease.mjs
